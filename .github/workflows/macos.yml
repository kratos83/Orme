name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Installa Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          modules: qtmultimedia
          cache: true

      - name: Genera l'icona (.icns)
        run: iconutil -c icns packaging/macos/AppIcon.iconset -o packaging/macos/AppIcon.icns

      - name: Configura (binario universale x86_64 + arm64)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_MACOSX_BUNDLE=ON

      - name: Compila
        run: cmake --build build --config Release -j

      - name: Prepara il bundle (macdeployqt)
        run: macdeployqt build/Orme.app -qmldir=qml

      - name: Crea il .dmg (con collegamento ad Applications e vista a icone)
        run: |
          set -euo pipefail
          staging=dmg-staging
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R build/Orme.app "$staging/"
          ln -s /Applications "$staging/Applications"

          rm -f Orme-rw.dmg
          hdiutil create -volname Orme -srcfolder "$staging" -ov -format UDRW -fs HFS+ Orme-rw.dmg
          mount_dir="/Volumes/Orme"
          hdiutil attach Orme-rw.dmg -mountpoint "$mount_dir"

          osascript packaging/macos/dmg-layout.applescript

          sync
          hdiutil detach "$mount_dir"
          hdiutil convert Orme-rw.dmg -format UDZO -ov -o Orme-macos-universal.dmg
          rm -f Orme-rw.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: orme-macos
          path: Orme-macos-universal.dmg

      - name: Pubblica su GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Orme-macos-universal.dmg
          body_path: RELEASE_NOTES.md
