name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Installa Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          modules: qtmultimedia
          cache: true

      - name: Genera l'icona (.icns)
        run: iconutil -c icns packaging/macos/AppIcon.iconset -o packaging/macos/AppIcon.icns

      - name: Configura (binario universale x86_64 + arm64)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_MACOSX_BUNDLE=ON

      - name: Compila
        run: cmake --build build --config Release -j

      - name: Crea il .dmg (macdeployqt)
        run: |
          set -euo pipefail
          macdeployqt build/Orme.app -qmldir=qml -dmg
          mv build/Orme.dmg Orme-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: orme-macos
          path: Orme-macos-universal.dmg

      - name: Pubblica su GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Orme-macos-universal.dmg
          body_path: RELEASE_NOTES.md
