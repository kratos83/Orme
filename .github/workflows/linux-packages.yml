name: Pacchetti Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            format: rpm
          - distro: opensuse
            format: rpm
          - distro: mageia
            format: rpm
          - distro: arch
            format: pkg.tar.zst
          - distro: alpine
            format: apk
          - distro: debian
            format: deb

    runs-on: ubuntu-latest
    name: ${{ matrix.distro }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build (Docker)
        run: bash packaging/linux/${{ matrix.distro }}/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: orme-${{ matrix.distro }}
          path: packaging/out/${{ matrix.distro }}/

      - name: Pubblica su GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/out/${{ matrix.distro }}/*
          body_path: RELEASE_NOTES.md
