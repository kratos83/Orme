name: Pacchetti Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            format: rpm
          - distro: opensuse
            format: rpm
          - distro: mageia
            format: rpm
          - distro: arch
            format: pkg.tar.zst
          - distro: alpine
            format: apk
          - distro: debian
            format: deb

    runs-on: ubuntu-latest
    name: ${{ matrix.distro }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build (Docker)
        run: bash packaging/linux/${{ matrix.distro }}/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: orme-${{ matrix.distro }}
          path: packaging/out/${{ matrix.distro }}/

      - name: Pubblica su GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/out/${{ matrix.distro }}/*
          body_path: RELEASE_NOTES.md

  # Genera e firma i repository apt (Debian) e rpm (Fedora/openSUSE/Mageia),
  # poi li pubblica su GitHub Pages. Il pacchetto stesso (debian/orme.install,
  # %post nei .spec) abilita questi repository all'installazione, cosi' le
  # versioni future arrivano con i normali "apt upgrade"/"dnf update"/
  # "zypper update" del sistema. Arch e Alpine restano fuori (nessun repo
  # personalizzato per loro): solo download manuale dalle Release, come oggi.
  #
  # Richiede due cose fatte UNA VOLTA SOLA dal proprietario del repository,
  # non da questa Action:
  #   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
  #   2. Settings -> Secrets and variables -> Actions -> New repository secret
  #      ORME_GPG_PRIVATE_KEY = la chiave privata armored generata per Orme
  #      (packaging/repo/README.md spiega come esportarla ed e' l'unico posto
  #      dove deve stare: mai committata nel repository)
  publish-repo:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Scarica tutti i pacchetti Linux buildati
        uses: actions/download-artifact@v4
        with:
          pattern: orme-*
          path: artifacts

      - name: Installa gli strumenti per generare i repository
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev createrepo-c rpm gnupg

      - name: Importa la chiave di firma GPG
        env:
          ORME_GPG_PRIVATE_KEY: ${{ secrets.ORME_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ORME_GPG_PRIVATE_KEY" ]; then
            echo "Manca il secret ORME_GPG_PRIVATE_KEY: vedi packaging/repo/README.md" >&2
            exit 1
          fi
          echo "$ORME_GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          # rpm deve firmare senza terminale interattivo (nessuna passphrase
          # sulla chiave: e' protetta solo dall'essere un secret della CI).
          cat > ~/.rpmmacros <<EOF
          %_gpg_name $GPG_KEY_ID
          %__gpg_sign_cmd %{__gpg} gpg --batch --pinentry-mode loopback --passphrase '' --no-verbose --no-armor --digest-algo sha256 --sign --detach-sign --output %{__signature_filename} %{__plaintext_filename}
          EOF

      - name: Genera il repository apt (Debian/Ubuntu)
        run: |
          set -euo pipefail
          mkdir -p site/apt
          cp artifacts/orme-debian/*.deb site/apt/
          cd site/apt
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -9c Packages > Packages.gz
          apt-ftparchive release . > Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --detach-sign --armor -o Release.gpg Release

      - name: Genera i repository rpm (Fedora/openSUSE/Mageia)
        run: |
          set -euo pipefail
          for distro in fedora opensuse mageia; do
            mkdir -p "site/rpm/$distro"
            cp artifacts/orme-$distro/*.rpm "site/rpm/$distro/"
            for f in "site/rpm/$distro"/*.rpm; do
              rpm --addsign "$f"
            done
            createrepo_c "site/rpm/$distro"
            gpg --batch --yes --default-key "$GPG_KEY_ID" --detach-sign --armor \
                -o "site/rpm/$distro/repodata/repomd.xml.asc" "site/rpm/$distro/repodata/repomd.xml"
          done

      - name: Copia la chiave pubblica (per gpgkey= nei file .repo)
        run: cp packaging/repo/orme-archive-keyring.asc site/orme-archive-keyring.asc

      - name: Carica l'artefatto per GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
