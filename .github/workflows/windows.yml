name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Installa Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configura
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"
          -DCMAKE_WIN32_EXECUTABLE=ON

      - name: Compila
        run: cmake --build build --config Release -j

      - name: Prepara il pacchetto portable (windeployqt)
        shell: bash
        run: |
          set -eu
          mkdir -p dist/Orme
          cp build/Release/Orme.exe dist/Orme/Orme.exe
          windeployqt.exe --qmldir qml --release dist/Orme/Orme.exe
          cp COPYRIGHT dist/Orme/COPYRIGHT.txt

      - name: Comprimi
        shell: bash
        run: |
          cd dist
          7z a -tzip Orme-windows-portable-x64.zip Orme

      - uses: actions/upload-artifact@v4
        with:
          name: orme-windows-portable-x64
          path: dist/Orme-windows-portable-x64.zip

      - name: Pubblica su GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Orme-windows-portable-x64.zip
          body_path: RELEASE_NOTES.md

      - name: Determina la versione per l'installer
        shell: bash
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Crea l'installer Windows (Inno Setup)
        shell: cmd
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: orme-windows-setup-x64
          path: dist/Orme-windows-setup-x64.exe

      - name: Pubblica l'installer su GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Orme-windows-setup-x64.exe
          body_path: RELEASE_NOTES.md
