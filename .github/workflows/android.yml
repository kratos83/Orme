name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.8.2"
  NDK_VERSION: "26.3.11579264"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Imposta Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Imposta Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Installa l'NDK richiesto
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Installa Qt desktop (richiesto dal toolchain Android come "host")
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia qtshadertools
          dir: ${{ github.workspace }}/qt-desktop
          cache: true

      - name: Installa Qt per Android (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          dir: ${{ github.workspace }}/qt-android
          cache: true

      # ABI 32-bit: alcuni tablet con CPU 64-bit (es. Huawei MediaPad T5,
      # Kirin 659) montano comunque un firmware Android userspace a 32-bit,
      # che rifiuta un APK solo arm64-v8a con un generico "errore
      # nell'analisi del pacchetto". Stessa "dir" del kit arm64-v8a sopra:
      # QT_ANDROID_BUILD_ALL_ABIS le trova come sottocartelle sorelle.
      - name: Installa Qt per Android (armeabi-v7a)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_armv7
          modules: qtmultimedia
          dir: ${{ github.workspace }}/qt-android
          cache: true

      # Firma di release: solo sui tag (i secret comunque non sono
      # disponibili nelle run di pull_request da fork). Senza, l'APK resta
      # non firmata come prima - installabile solo in debug/sideload manuale.
      - name: Prepara la keystore di firma
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/orme-release.keystore"

      # Stessa ricetta validata localmente in packaging/android/build.sh:
      # serve un Qt "host" (gcc_64) distinto dal kit Android per il
      # toolchain di cross-compilazione e QT_ANDROID_BUILD_ALL_ABIS=ON per
      # impacchettare tutte le ABI Qt trovate come sorelle sotto qt-android/
      # (qui: arm64-v8a + armeabi-v7a) in un unico APK multi-arch. Il fix
      # per l'install() dei target Android (vedi CMakeLists.txt) vive nel
      # CMakeLists.txt root, non nell'hook, perche' le sotto-build
      # automatiche per le ABI extra non ereditano CMAKE_PROJECT_INCLUDE.
      # minSdkVersion (compatibilita' con tablet come il MediaPad T5,
      # Android 8 Oreo) e' impostata come target property nell'hook CMake,
      # non qui: non e' una variabile CMake, -D non avrebbe alcun effetto.
      - name: Configura
        run: >
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/qt-android/Qt/${{ env.QT_VERSION }}/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake"
          -DQT_HOST_PATH="${{ github.workspace }}/qt-desktop/Qt/${{ env.QT_VERSION }}/gcc_64"
          -DQT_HOST_PATH_CMAKE_DIR="${{ github.workspace }}/qt-desktop/Qt/${{ env.QT_VERSION }}/gcc_64/lib/cmake/Qt6"
          -DANDROID_SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"
          -DANDROID_NDK_ROOT="${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}"
          -DQT_ANDROID_BUILD_ALL_ABIS=ON
          -DANDROID_ABI=arm64-v8a
          -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/qt-android/Qt/${{ env.QT_VERSION }}/android_arm64_v8a"
          -DCMAKE_PROJECT_INCLUDE="${{ github.workspace }}/packaging/android/cmake_hooks/android_install_fix.cmake"
          -DCMAKE_BUILD_TYPE=Release

      - name: Compila (C++)
        run: cmake --build build-android -j

      - name: Genera l'APK (androiddeployqt)
        run: cmake --build build-android --target Orme_make_apk

      # androiddeployqt/Gradle non hanno un signing config di release
      # collegato, quindi producono sempre un *-unsigned.apk: lo allineiamo
      # e firmiamo qui a mano con gli strumenti dei build-tools dell'SDK,
      # indipendentemente da come Qt/Gradle genera il pacchetto.
      - name: Firma l'APK di release (zipalign + apksigner)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(dirname "$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -name zipalign | sort -V | tail -n1)")"
          UNSIGNED_APK="$(find build-android -iname '*-unsigned.apk' | head -n1)"
          ALIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-aligned.apk"
          SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-signed.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/orme-release.keystore" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "pass:$KEYSTORE_STORE_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

      - name: Trova l'APK generato
        id: find_apk
        run: |
          set -euo pipefail
          apk=$(find build-android -iname "*-signed.apk" | head -n1)
          if [ -z "$apk" ]; then
            apk=$(find build-android -iname "*.apk" -path "*apk/debug*" | head -n1)
          fi
          if [ -z "$apk" ]; then
            apk=$(find build-android -iname "*.apk" | head -n1)
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: orme-android-tablet-arm64
          path: ${{ steps.find_apk.outputs.path }}

      - name: Pubblica su GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.path }}
          body_path: RELEASE_NOTES.md
